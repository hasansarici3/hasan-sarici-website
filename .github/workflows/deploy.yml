name: Build and Deploy Academic Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BABELQUARTO_CI_URL: "https://hasansarici.com/"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@26d2b11b992bfbcec19d2d4d7951d252d92a1ea1 # v2
        with:
          version: "1.10.18"

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: |
            any::quarto
            ropensci-review-tools/babelquarto@73d9696159182b963b611007ea66f50ca51af2fd
          install-quarto: false

      - name: Build PDF CVs and website
        shell: Rscript {0}
        run: |
          source("build_site.R", chdir = TRUE)

      - name: Validate built site
        run: python3 scripts/validate_site.py

      - name: Setup Pages
        uses: actions/configure-pages@f593f568227858257d1e9e3a55bd051ee19e0c0d # v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@854b64a20b74c5e5a1fcf3648bf4f017c0bd6eee # v4
